  <!-- Cyan/blue heading bar -->
  <rect x="62" y="64" width="76" height="16" rx="8" fill="url(#accentGrad)"/>

  <!-- Note body lines (shifted up 8px, 30px vertical pitch) -->
  <rect x="62" y="98" width="126" height="14" rx="7" fill="#828896"/>
  <rect x="62" y="128" width="88" height="14" rx="7" fill="#6d7380"/>
  <rect x="62" y="158" width="54" height="14" rx="7" fill="#828896"/>
  <rect x="62" y="188" width="50" height="14" rx="7" fill="#5e6470"/>

  <!-- Bottom-right larger bold 'C' letter (shifted up 8px, 14px right margin) -->
  <path d="M192 167 C186.5 159.5 178.5 155.5 168.5 155.5 C150.5 155.5 138 168 138 184 C138 200 150.5 212.5 168.5 212.5 C178.5 212.5 186.5 208.5 192 201"
        fill="none" stroke="url(#cGrad)" stroke-width="20" stroke-linecap="round"/>
</svg>
