<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sheetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#272a31"/>
      <stop offset="100%" stop-color="#191b20"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4cc2ff"/>
      <stop offset="100%" stop-color="#2684ff"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4cc2ff"/>
      <stop offset="100%" stop-color="#2275ff"/>
    </linearGradient>
  </defs>

  <!-- Standalone notes sheet (no outer squircle) -->
  <path d="M58 18 H164 L216 70 V214 A24 24 0 0 1 192 238 H58 A24 24 0 0 1 34 214 V42 A24 24 0 0 1 58 18 Z"
